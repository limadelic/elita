name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check config drift from lock baseline
        run: git diff --quiet 83e35970b682b067fe07290663f111451b03d9cb HEAD -- .credo.exs .githooks/ || (echo "config drift from lock baseline" && exit 1)

  test:
    uses: ./.github/workflows/test.yml

  cukes:
    needs: [lint, test]
    uses: ./.github/workflows/cukes.yml

  site:
    needs: [lint, test, cukes, lock]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/site.yml

  tag:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check if freeq tag exists
        id: check_tag
        run: |
          if git ls-remote --tags origin freeq | grep -q freeq; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create and push freeq tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git tag freeq
          git push origin freeq
