name: Badges

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number'
        required: true
        type: number

permissions:
  pull-requests: write

jobs:
  badges:
    if: github.event.pull_request || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve PR number
        id: pr
        env:
          PR_FROM_EVENT: ${{ github.event.pull_request.number }}
          PR_FROM_INPUT: ${{ inputs.pr }}
        run: |
          if [ -n "$PR_FROM_EVENT" ]; then
            PR_NUMBER=$PR_FROM_EVENT
          else
            PR_NUMBER=$PR_FROM_INPUT
          fi
          echo "number=$PR_NUMBER" >> $GITHUB_OUTPUT

      - name: Add badge block to PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          LINT_URL: "https%3A%2F%2Flimadelic.github.io%2Felita%2F${{ steps.pr.outputs.number }}%2Flint.json"
          CUKES_URL: "https%3A%2F%2Flimadelic.github.io%2Felita%2F${{ steps.pr.outputs.number }}%2Fcukes.json"
          COVER_URL: "https%3A%2F%2Flimadelic.github.io%2Felita%2F${{ steps.pr.outputs.number }}%2Fcover.json"
        run: |
          gh pr view $PR_NUMBER --json body -q .body > /tmp/body.md
          ruby ops/ci/body.rb
          gh pr edit $PR_NUMBER --body-file /tmp/body.md
