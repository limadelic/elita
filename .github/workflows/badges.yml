name: Badges

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write

jobs:
  badges:
    if: github.event.pull_request
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Add badge block to PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          LINT_URL="https%3A%2F%2Flimadelic.github.io%2Felita%2F$PR_NUMBER%2Flint.json"
          CUKES_URL="https%3A%2F%2Flimadelic.github.io%2Felita%2F$PR_NUMBER%2Fcukes.json"
          COVER_URL="https%3A%2F%2Flimadelic.github.io%2Felita%2F$PR_NUMBER%2Fcover.json"
          cat > /tmp/badges.md << 'BADGEEOF'
          <!-- badges-start -->
          [![lint](https://img.shields.io/endpoint?url=$LINT_URL)](https://limadelic.github.io/elita/$PR_NUMBER/report.html)
          [![cukes](https://img.shields.io/endpoint?url=$CUKES_URL)](https://limadelic.github.io/elita/$PR_NUMBER/report.html)
          [![cover](https://img.shields.io/endpoint?url=$COVER_URL)](https://limadelic.github.io/elita/$PR_NUMBER/cover.json)
          <!-- badges-end -->
          BADGEEOF
          sed -i 's|\$LINT_URL|'"$LINT_URL"'|g; s|\$CUKES_URL|'"$CUKES_URL"'|g; s|\$COVER_URL|'"$COVER_URL"'|g; s|\$PR_NUMBER|'"$PR_NUMBER"'|g' /tmp/badges.md
          gh pr view $PR_NUMBER --json body -q .body > /tmp/body.md
          sed -i '' '/<!-- badges-start -->/,/<!-- badges-end -->/d; /^\[\!/d' /tmp/body.md
          echo "" >> /tmp/body.md
          cat /tmp/badges.md >> /tmp/body.md
          gh pr edit $PR_NUMBER --body-file /tmp/body.md
