name: Site

on: workflow_call

permissions:
  pages: write
  id-token: write

jobs:
  site:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute deployment prefix
        id: prefix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          PREFIX=$(ops/ci/site/prefix.rb)
          echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"
          echo "target=$PREFIX" >> "$GITHUB_OUTPUT"

      - name: Sanitize branch name for artifact
        id: branch_slug
        run: |
          branch="${{ github.ref_name }}"
          slug="${branch//\//-}"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      - name: Create site directory
        run: |
          PREFIX="${{ steps.prefix.outputs.prefix }}"
          if [ -n "$PREFIX" ]; then
            mkdir -p "site/$PREFIX"
          else
            mkdir -p site
          fi

      - name: Seed site from live Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ops/ci/site/seed.rb

      - name: Merge previous github-pages artifact as base
        run: ops/ci/site/merge.rb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        continue-on-error: true

      - name: Download lint badge artifact
        uses: actions/download-artifact@v4
        with:
          name: lint-badge
          path: /tmp/lint-art
        continue-on-error: true

      - name: Download cukes HTML artifact
        uses: actions/download-artifact@v4
        with:
          name: cukes-html-${{ steps.branch_slug.outputs.slug }}
          path: /tmp/cukes-art
        continue-on-error: true

      - name: Download coverage badge artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-badge-${{ steps.branch_slug.outputs.slug }}
          path: /tmp/cover-art

      - name: Copy lint files flat into prefix
        run: |
          PREFIX="${{ steps.prefix.outputs.prefix }}"
          if [ -d "/tmp/lint-art" ]; then
            if [ -n "$PREFIX" ]; then
              mkdir -p "site/$PREFIX"
              DEST="site/$PREFIX"
            else
              DEST="site"
            fi
            find /tmp/lint-art -type f -exec cp {} "$DEST"/ \;
            rm -rf /tmp/lint-art
          fi
        continue-on-error: true

      - name: Copy cukes files flat into prefix
        run: |
          PREFIX="${{ steps.prefix.outputs.prefix }}"
          if [ -d "/tmp/cukes-art" ]; then
            if [ -n "$PREFIX" ]; then
              mkdir -p "site/$PREFIX"
              DEST="site/$PREFIX"
            else
              DEST="site"
            fi
            find /tmp/cukes-art -type f -exec cp {} "$DEST"/ \;
            rm -rf /tmp/cukes-art
          fi
        continue-on-error: true

      - name: Copy and validate coverage files
        run: ops/ci/site/cover.rb
        env:
          PREFIX: ${{ steps.prefix.outputs.prefix }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
