name: Cukes

on: workflow_call

permissions:
  contents: write
  pull-requests: write

jobs:
  cukes:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20.2'
          otp-version: '29'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-1.20.2-29-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-1.20.2-29-

      - name: Get dependencies
        run: mix deps.get

      - name: Build el escript
        run: |
          cd apps/el
          mix escript.build

      - name: Prepare elita
        run: |
          cd apps/elita
          mix compile

      - name: Checkout freeq
        uses: actions/checkout@v4
        with:
          repository: msuarz/freeq
          ref: 6859c084e254e399dbdd2b854d8d911e79a33014
          path: freeq

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build freeq Docker image
        uses: docker/build-push-action@v5
        with:
          context: freeq
          load: true
          tags: freeq:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start freeq server
        run: docker run -d --name freeq -p 16683:6667 -p 8081:8080 freeq:ci

      - name: Wait for freeq to be ready
        run: timeout 60 bash -c 'until curl -sf http://127.0.0.1:8081/api/v1/health; do sleep 1; done'

      - name: Run Cucumber tests
        id: cukes
        run: |
          mkdir -p reports
          TAPE=replay mix cukes --format html --out reports/cucumber.html --format json --out reports/cucumber.json --publish-quiet
        env:
          MIX_ENV: test

      - name: Run freeq Cucumber tests
        run: |
          mkdir -p reports
          mix cuke freeq --format html --out reports/cucumber_freeq.html --format json --out reports/cucumber_freeq.json --publish-quiet
        env:
          FREEQ_PORT: "16683"
          MIX_ENV: test
          TAPE: replay

      - name: Copy cucumber report to site
        run: |
          mkdir -p site
          cp reports/cucumber.html site/report.html
        if: always()

      - name: Inject legend into cucumber report
        run: ops/ci/cukes/legend.rb site/report.html
        if: always()

      - name: Generate cucumber badge
        run: ops/ci/badges/badges.rb
        env:
          BRANCH: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        if: always()

      - name: Upload Cucumber report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cukes-report-${{ github.run_id }}
          path: reports/

      - name: Sanitize branch name for artifact
        id: branch_slug
        run: |
          branch="${{ github.ref_name }}"
          slug="${branch//\//-}"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      - name: Upload cukes HTML artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cukes-html-${{ steps.branch_slug.outputs.slug }}
          path: site/
          retention-days: 1

      - name: Fail if tests failed
        if: failure()
        run: exit 1
