name: Test

on: workflow_call

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20.2'
          otp-version: '29'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-1.20.2-29-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-1.20.2-29-

      - name: Sanitize branch name for artifact
        id: branch_slug
        run: |
          branch="${{ github.ref_name }}"
          slug="${branch//\//-}"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      - name: Get dependencies
        run: mix deps.get

      - name: Run tests
        run: mix test
        env:
          MIX_ENV: test

      - name: Run coverage
        run: mix cover 2>&1 | tee /tmp/cover_output.txt
        continue-on-error: true
        env:
          MIX_ENV: test

      - name: Extract and report coverage
        run: |
          COVERAGE=$(grep "| Total" /tmp/cover_output.txt | grep -oE '[0-9]+\.[0-9]+' | tail -1)
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "Total coverage: **$COVERAGE%**" >> $GITHUB_STEP_SUMMARY
        id: coverage
        if: always()
        continue-on-error: true

      - name: Post coverage to PR
        run: |
          PR_NUMBER=$(gh pr list --head "$GITHUB_REF_NAME" --json number --jq '.[] | .number' 2>/dev/null || echo "")
          if [ -z "$PR_NUMBER" ]; then
            echo "No PR for branch, skipping comment"
            exit 0
          fi
          COVERAGE="${{ steps.coverage.outputs.coverage }}"
          MARKER="<!-- elita-coverage-report -->"
          BODY=$(cat <<EOF
          $MARKER

          ## Coverage: $COVERAGE%
          EOF
          )
          REPO="${{ github.repository }}"
          COMMENT_ID=$(gh api repos/$REPO/issues/$PR_NUMBER/comments \
            --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" 2>/dev/null | head -1 || echo "")
          if [ -n "$COMMENT_ID" ]; then
            gh api repos/$REPO/issues/$PR_NUMBER/comments/$COMMENT_ID -X PATCH -f body="$BODY"
          else
            gh pr comment $PR_NUMBER --body "$BODY"
          fi
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Generate coverage badge
        run: ops/ci/badges.rb
        env:
          BRANCH: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          COVERAGE_PERCENT: ${{ steps.coverage.outputs.coverage }}
          GH_TOKEN: ${{ github.token }}
        if: always()
        continue-on-error: true

      - name: Upload coverage badge artifact
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: coverage-badge-${{ steps.branch_slug.outputs.slug }}
          path: site/
