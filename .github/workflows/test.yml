name: Test

on: workflow_call

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20.2'
          otp-version: '29'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-1.20.2-29-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-1.20.2-29-

      - name: Sanitize branch name for artifact
        id: branch_slug
        run: |
          branch="${{ github.ref_name }}"
          slug="${branch//\//-}"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      - name: Compute deployment prefix
        id: prefix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: echo "prefix=$(ops/ci/site/prefix.rb)" >> "$GITHUB_OUTPUT"

      - name: Get dependencies
        run: mix deps.get

      - name: Checkout freeq
        uses: actions/checkout@v4
        with:
          repository: msuarz/freeq
          ref: 6859c084e254e399dbdd2b854d8d911e79a33014
          path: freeq

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build freeq Docker image
        uses: docker/build-push-action@v5
        with:
          context: freeq
          load: true
          tags: freeq:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start freeq server
        run: docker run -d --name freeq -p 6667:6667 -p 8080:8080 freeq:ci

      - name: Wait for freeq to be ready
        run: timeout 60 bash -c 'until nc -z 127.0.0.1 6667; do sleep 1; done'

      - name: Check freeq logs
        run: docker logs freeq

      - name: Run tests
        run: mix test
        env:
          MIX_ENV: test

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright with Chromium
        run: npx playwright install --with-deps chromium

      - name: Run greet test
        run: node apps/elita/test/freeq/greet.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brian-greet
          path: /tmp/freeq-playwright-videos

      - name: Comment on PR with greet video
        if: always()
        run: gh pr comment brian --body "Greet video available in [artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Run coverage
        run: bash -o pipefail -c 'mix cover 2>&1 | tee /tmp/cover_output.txt'
        env:
          MIX_ENV: test

      - name: Extract and report coverage
        run: |
          COVERAGE=$(grep "| Total" /tmp/cover_output.txt | grep -oE '[0-9]+\.[0-9]+' | tail -1)
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "Total coverage: **$COVERAGE%**" >> $GITHUB_STEP_SUMMARY
        id: coverage
        if: always()

      - name: Post coverage to PR
        run: ops/ci/cover/comment.rb
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          COVERAGE_PERCENT: ${{ steps.coverage.outputs.coverage }}

      - name: Generate coverage badge
        run: ops/ci/badges/badges.rb
        env:
          BRANCH: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          COVERAGE_PERCENT: ${{ steps.coverage.outputs.coverage }}
          GH_TOKEN: ${{ github.token }}
        if: always()

      - name: Copy coverage HTML files
        run: |
          if [ -d "apps/elita/cover" ]; then
            PREFIX="${{ steps.prefix.outputs.prefix }}"
            mkdir -p "site/${PREFIX}cover"
            find apps/elita/cover -maxdepth 1 -name "*.html" -exec cp {} "site/${PREFIX}cover/" \;
          fi
        if: always()

      - name: Generate coverage index
        run: |
          mkdir -p "site/${{ steps.prefix.outputs.prefix }}cover"
          ops/ci/cover/report.rb
        env:
          PREFIX: ${{ steps.prefix.outputs.prefix }}
        if: always()

      - name: Upload coverage badge artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-badge-${{ steps.branch_slug.outputs.slug }}
          path: site/
