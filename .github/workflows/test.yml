name: Test

on: workflow_call

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20.2'
          otp-version: '29'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-1.20.2-29-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-1.20.2-29-

      - name: Cache freeq-server binary
        id: freeq-cache
        uses: actions/cache@v4
        with:
          path: .freeq-bin/freeq-server
          key: freeq-bin-2ff392ec

      - name: Build freeq-server
        if: steps.freeq-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/freeq-irc/freeq /tmp/freeq
          cd /tmp/freeq && git checkout 2ff392ec2540289eb202e6caebeff8c50ad6a3b0
          rustup toolchain install stable
          cargo build --release -p freeq-server
          mkdir -p ${{ github.workspace }}/.freeq-bin
          cp target/release/freeq-server ${{ github.workspace }}/.freeq-bin/

      - name: Start freeq server
        run: |
          mkdir -p /tmp/freeq-data
          ${{ github.workspace }}/.freeq-bin/freeq-server \
            --bind 127.0.0.1:6667 \
            --db-path /tmp/freeq-data/irc.db \
            --data-dir /tmp/freeq-data \
            --web-addr 127.0.0.1:8080 \
            > /tmp/freeq.log 2>&1 &
          echo "$!" > /tmp/freeq.pid

      - name: Wait for web listener on 8080
        run: |
          for i in {1..50}; do
            if nc -z 127.0.0.1 8080 2>/dev/null; then
              echo "Web listener ready"
              break
            fi
            sleep 0.2
            if [ $i -eq 50 ]; then
              echo "Timeout waiting for 8080"
              exit 1
            fi
          done

      - name: Check WebSocket on 8080
        run: |
          node -e "
          const ws = new WebSocket('ws://127.0.0.1:8080/irc');
          const timeout = setTimeout(() => { console.log('ws timeout'); process.exit(1); }, 5000);
          ws.addEventListener('open', () => { console.log('ws open'); clearTimeout(timeout); process.exit(0); });
          ws.addEventListener('error', (err) => { console.log(err.message || err); clearTimeout(timeout); process.exit(1); });
          "

      - name: Clone freeqworld
        run: |
          git clone https://github.com/chad/freeqworld.git $RUNNER_TEMP/freeqworld
          cd $RUNNER_TEMP/freeqworld
          git checkout 93da7a1

      - name: Apply freeqworld patch
        run: |
          cd $RUNNER_TEMP/freeqworld
          git apply ${{ github.workspace }}/ops/ci/greet-cam/freeqworld.patch

      - name: Build freeqworld
        run: |
          cd $RUNNER_TEMP/freeqworld
          npm install
          npm run build

      - name: Start freeqworld server
        run: |
          cd $RUNNER_TEMP/freeqworld
          FIMP_START=1 PORT_A=5173 npx vite-node server/src/main.ts > $RUNNER_TEMP/freeqworld.log 2>&1 &
          echo "$!" > $RUNNER_TEMP/freeqworld.pid

      - name: Wait for freeqworld on 5173
        run: |
          for i in {1..150}; do
            if nc -z 127.0.0.1 5173 2>/dev/null; then
              http_code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5173/)
              if [ "$http_code" = "200" ]; then
                echo "FreeqWorld ready with HTTP 200"
                exit 0
              fi
            fi
            sleep 0.2
            if [ $i -eq 150 ]; then
              echo "Timeout waiting for freeqworld on 5173"
              ps -p $(cat $RUNNER_TEMP/freeqworld.pid) -o pid,stat,etime,args || echo "freeqworld pid gone"
              echo "Server log:"
              cat $RUNNER_TEMP/freeqworld.log
              exit 1
            fi
          done

      - name: Sanitize branch name for artifact
        id: branch_slug
        run: |
          branch="${{ github.ref_name }}"
          slug="${branch//\//-}"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      - name: Compute deployment prefix
        id: prefix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: echo "prefix=$(ops/ci/site/prefix.rb)" >> "$GITHUB_OUTPUT"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Print tool versions
        run: |
          ffmpeg -version | head -1
          google-chrome --version
          node --version

      - name: Get dependencies
        run: mix deps.get

      - name: Run tests
        run: mix test
        env:
          MIX_ENV: test

      - name: Run coverage
        run: bash -o pipefail -c 'mix cover 2>&1 | tee /tmp/cover_output.txt'
        env:
          MIX_ENV: test

      - name: Record freeq tests
        run: |
          LOG_FILE="$RUNNER_TEMP/greet-cam.log"
          PID_FILE="$RUNNER_TEMP/greet-cam.pid"

          # Start record.js in background
          node ops/ci/greet-cam/record.js \
            --out "$RUNNER_TEMP/greet-cam-out" \
            --channel "#the-lab" \
            > "$LOG_FILE" 2>&1 &
          echo "$!" > "$PID_FILE"

          # Wait for GREETCAM READY
          deadline=$((SECONDS + 60))
          while [ $SECONDS -lt $deadline ]; do
            if grep -q "GREETCAM FAILED" "$LOG_FILE"; then
              echo "Recorder failed:"
              cat "$LOG_FILE"
              exit 1
            fi
            if grep -q "GREETCAM READY" "$LOG_FILE"; then
              echo "Recorder ready"
              break
            fi
            sleep 0.5
          done

          if [ $SECONDS -ge $deadline ]; then
            echo "Timeout waiting for GREETCAM READY (60s)"
            cat "$LOG_FILE"
            exit 1
          fi

          # Run the freeq tests ONLY
          cd apps/elita && mix test test/freeq

          # Stop the recorder
          PID=$(cat "$PID_FILE")
          [ -n "$PID" ] && [ "$PID" -gt 1 ] || { echo "refusing to signal pid '$PID'"; exit 1; }
          kill -TERM "$PID"

          cd "${{ github.workspace }}"

          # Wait for GREETCAM DONE
          deadline=$((SECONDS + 60))
          MP4_PATH=""
          while [ $SECONDS -lt $deadline ]; do
            if grep -q "GREETCAM DONE" "$LOG_FILE"; then
              done_line=$(grep "GREETCAM DONE" "$LOG_FILE" | tail -1)
              if [[ "$done_line" =~ mp4:([^ ]+) ]]; then
                MP4_PATH="${BASH_REMATCH[1]}"
              fi
              break
            fi
            sleep 0.5
          done

          if [ $SECONDS -ge $deadline ]; then
            echo "Timeout waiting for GREETCAM DONE (60s)"
            cat "$LOG_FILE"
            exit 1
          fi

          if [ -z "$MP4_PATH" ]; then
            echo "Failed to parse mp4 path from GREETCAM DONE line"
            cat "$LOG_FILE"
            exit 1
          fi

          # Copy to freeq.mp4 and validate
          cp "$MP4_PATH" freeq.mp4
          test -s freeq.mp4 || { echo "freeq.mp4 is empty or does not exist"; exit 1; }

          ls -la freeq.mp4
        env:
          GREETCAM_WORLD_URL: http://127.0.0.1:5173/?freeq=ws://127.0.0.1:8080/irc

      - name: Extract and report coverage
        run: |
          COVERAGE=$(grep "| Total" /tmp/cover_output.txt | grep -oE '[0-9]+\.[0-9]+' | tail -1)
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "Total coverage: **$COVERAGE%**" >> $GITHUB_STEP_SUMMARY
        id: coverage
        if: always()

      - name: Post coverage to PR
        run: ops/ci/cover/comment.rb
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          COVERAGE_PERCENT: ${{ steps.coverage.outputs.coverage }}

      - name: Print freeq server log
        run: |
          if [ -f /tmp/freeq.log ]; then
            cat /tmp/freeq.log
          else
            echo "freeq log not found"
          fi
        if: always()

      - name: Generate coverage badge
        run: ops/ci/badges/badges.rb
        env:
          BRANCH: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          COVERAGE_PERCENT: ${{ steps.coverage.outputs.coverage }}
          GH_TOKEN: ${{ github.token }}
        if: always()

      - name: Copy coverage HTML files
        run: |
          if [ -d "apps/elita/cover" ]; then
            PREFIX="${{ steps.prefix.outputs.prefix }}"
            mkdir -p "site/${PREFIX}cover"
            find apps/elita/cover -maxdepth 1 -name "*.html" -exec cp {} "site/${PREFIX}cover/" \;
          fi
        if: always()

      - name: Generate coverage index
        run: |
          mkdir -p "site/${{ steps.prefix.outputs.prefix }}cover"
          ops/ci/cover/report.rb
        env:
          PREFIX: ${{ steps.prefix.outputs.prefix }}
        if: always()

      - name: Upload coverage badge artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-badge-${{ steps.branch_slug.outputs.slug }}
          path: site/

      - name: Upload freeq video artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: freeq-video-${{ steps.branch_slug.outputs.slug }}
          path: freeq.mp4
